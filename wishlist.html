<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keranjang – FJ.Store</title>

<style>
body{
  margin:0;
  padding:0;
  font-family:Poppins,sans-serif;
  background:url("latarbelakang.jpg") center/cover no-repeat fixed;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  backdrop-filter: blur(10px);
  background: rgba(0,0,0,0.45);
  z-index:-1;
}

/* HEADER */
header{
  background:rgba(0,0,0,0.6);
  padding:18px;
  text-align:center;
  font-size:22px;
  font-weight:700;
  color:#fff;
  border-bottom:1px solid rgba(255,255,255,0.3);
  position:relative;
}

/* BACK BUTTON */
.back-btn{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  font-size:22px;
  cursor:pointer;
}

/* CONTAINER */
.wishlist-container{
  max-width:900px;
  margin:100px auto 40px;
  padding:20px;
  display:grid;
  gap:20px;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
}

/* CARD */
.wishlist-card{
  background: rgba(255,255,255,0.15);
  border-radius:16px;
  padding:15px;
  text-align:center;
  color:#fff;
  border:1px solid rgba(255,255,255,0.25);
  box-shadow:0 4px 25px rgba(0,0,0,0.25);
  backdrop-filter: blur(8px);
  transition:.3s;
}
.wishlist-card:hover{
  transform: scale(1.03);
  background: rgba(255,255,255,0.25);
}
.wishlist-card img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:12px;
}

/* TEXT */
.product-name{
  font-size:18px;
  font-weight:600;
  margin:8px 0;
}
.product-price{
  font-size:16px;
  color:#ffe066;
  margin-bottom:12px;
}

/* BUTTON */
.detail-btn,
.remove-btn{
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
}
.detail-btn{
  background:linear-gradient(135deg,#0099ff,#006aff);
  color:#fff;
  margin-bottom:8px;
}
.remove-btn{
  background:linear-gradient(135deg,#ff2d55,#ff005e);
  color:#fff;
}

/* EMPTY */
.empty{
  text-align:center;
  margin-top:140px;
  font-size:20px;
  font-weight:600;
  color:#fff;
}

/* NOTIF */
#popupNotif{
  position:fixed;
  top:20px;
  right:20px;
  padding:12px 20px;
  background:#fff;
  border-radius:12px;
  display:none;
  z-index:9999;
}
</style>
</head>

<body>

<header>
  <div class="back-btn" onclick="history.back()">←</div>
  Keranjang Saya 🛒
</header>

<div id="popupNotif"></div>

<div id="wishlistContainer" class="wishlist-container"></div>

<div id="emptyMessage" class="empty" style="display:none;">
  Keranjang belanja Anda kosong<br>
  Tambahkan produk dari halaman toko
</div>

<script>
function getWishlist(){
  return JSON.parse(localStorage.getItem("wishlist")) || [];
}
function saveWishlist(list){
  localStorage.setItem("wishlist", JSON.stringify(list));
}
function showNotif(txt){
  const n=document.getElementById("popupNotif");
  n.innerText=txt;
  n.style.display="block";
  setTimeout(()=>n.style.display="none",1500);
}

async function removeWishlist(id, card){
  let raw=getWishlist().filter(x=>Number(x)!==Number(id));
  saveWishlist(raw);
  card.remove();
  showNotif("🛒 Dihapus dari keranjang");
  if(raw.length===0) loadWishlist();
}

async function loadWishlist(){
  const container=document.getElementById("wishlistContainer");
  const empty=document.getElementById("emptyMessage");
  container.innerHTML="";

  let products=[];
  try{
    const res=await fetch("products.json");
    products=await res.json();
  }catch(e){}

  const wish=getWishlist();
  if(wish.length===0){
    empty.style.display="block";
    return;
  }
  empty.style.display="none";

  wish.forEach(id=>{
    const p=products.find(x=>Number(x.id)===Number(id));
    if(!p) return;

    const card=document.createElement("div");
    card.className="wishlist-card";
    card.innerHTML=`
      <img src="${p.image}">
      <div class="product-name">${p.name}</div>
      <div class="product-price">Rp ${Number(p.price).toLocaleString("id-ID")}</div>
      <button class="detail-btn">Lihat Detail</button>
      <button class="remove-btn">Hapus dari Keranjang 🛒</button>
    `;

    card.querySelector(".detail-btn").onclick=()=>{
      location.href="detail.html?id="+p.id;
    };
    card.querySelector(".remove-btn").onclick=()=>{
      removeWishlist(p.id, card);
    };

    container.appendChild(card);
  });
}

loadWishlist();
window.addEventListener("storage", e=>{
  if(e.key==="wishlist") loadWishlist();
});
</script>

</body>
</html>
