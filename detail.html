<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Produk</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
/* ================= HEADER BAR ================= */
.header-bar{
  position:sticky;
  top:0;
  height:56px;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(10px);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  z-index:9999;
  border-bottom:1px solid rgba(255,255,255,.2);
}
.header-bar .back{
  position:absolute;
  left:15px;
  font-size:24px;
  cursor:pointer;
}
.header-bar .cart{
  position:absolute;
  right:15px;
  font-size:22px;
  cursor:pointer;
}

/* ================= KODE ASLI KAMU ================= */
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:
  linear-gradient(135deg, rgba(255,0,150,0.4), rgba(0,120,255,0.4)),
  url('https://images.unsplash.com/photo-1512436991641-6745cdb1723f');
  background-size:cover;
  background-position:center;
}
.container{
  max-width:480px;
  margin:30px auto;
  padding:20px;
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(12px);
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.25);
}
.image-box img{ width:100%; border-radius:15px; }
.info-box h2{ color:#fff; }
.price-big{ color:#ffecec; font-size:22px; font-weight:700; }

.qty-box{
  display:flex;
  gap:10px;
  margin:15px 0;
}
.qty-box button{
  width:40px;height:40px;
  border:none;
  border-radius:8px;
  background:rgba(255,255,255,.3);
  color:white;
  font-size:22px;
  cursor:pointer;
}
.qty-box input{
  width:60px;
  text-align:center;
  border:none;
  border-radius:8px;
}

.btn-group{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.btn{
  padding:15px;
  border:none;
  border-radius:12px;
  font-weight:600;
  cursor:pointer;
}
.btn-cart{ background:rgba(255,255,255,.25); color:white; }
.btn-buy{
  background:linear-gradient(135deg,#ff0095,#007bff);
  color:white;
}

/* ================= MINI CART ================= */
#miniCart{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#ff0095;
  color:white;
  padding:12px 18px;
  border-radius:50px;
  cursor:pointer;
  z-index:999;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header-bar">
  <div class="back" onclick="history.back()">←</div>
  <div>Detail Produk</div>
  <div class="cart" onclick="location.href='wishlist.html'">🛒</div>
</div>

<div class="container">
  <div class="image-box">
    <img id="productImage">
  </div>

  <div class="info-box">
    <h2 id="productName"></h2>
    <div class="price-big" id="productPrice"></div>
    <p id="productDescription" style="color:#eee"></p>

    <div class="qty-box">
      <button id="minusBtn">-</button>
      <input id="qtyInput" type="number" value="1" min="1">
      <button id="plusBtn">+</button>
    </div>

    <div class="btn-group">
      <button class="btn btn-cart" id="addCartBtn">+ Tambah ke Keranjang</button>
      <button class="btn btn-buy" id="buyNowBtn">Beli Sekarang</button>
    </div>
  </div>
</div>

<div id="miniCart" onclick="location.href='wishlist.html'">
  🛒 <span id="cartCount">0</span>
</div>

<script>
const id=new URLSearchParams(location.search).get("id");

async function loadDetail(){
  const res=await fetch("products.json");
  const data=await res.json();
  const p=data.find(x=>x.id==id);
  productImage.src=p.image;
  productName.innerText=p.name;
  productPrice.innerText="Rp "+p.price.toLocaleString("id-ID");
  productDescription.innerText=p.description;
}
loadDetail();

function updateLocalCart(id,qty){
  let cart=JSON.parse(localStorage.getItem("cart"))||[];
  const i=cart.findIndex(x=>x.id===id);
  if(i>-1) cart[i].qty=qty;
  else cart.push({id,qty});
  localStorage.setItem("cart",JSON.stringify(cart));
  updateMiniCart();
}

function updateMiniCart(){
  let cart=JSON.parse(localStorage.getItem("cart"))||[];
  cartCount.innerText=cart.reduce((a,b)=>a+b.qty,0);
}
updateMiniCart();

plusBtn.onclick=()=>{ qtyInput.value++; updateLocalCart(id,+qtyInput.value); }
minusBtn.onclick=()=>{ if(qtyInput.value>1){ qtyInput.value--; updateLocalCart(id,+qtyInput.value); } }
addCartBtn.onclick=()=>{
  updateLocalCart(id,+qtyInput.value);
  alert("Produk masuk ke keranjang");
}
</script>

</body>
</html>
