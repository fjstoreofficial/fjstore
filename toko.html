<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FJ.Store – Produk</title>

<style>
/* ================= KODE ASLI KAMU (TIDAK DIUBAH) ================= */
body { 
  font-family: Arial, sans-serif; 
  margin:0; 
  padding:0; 
  background:url('latarbelakang.jpg') center/cover no-repeat fixed; 
  position:relative; 
}
body::before { 
  content:""; 
  position:fixed; 
  inset:0; 
  backdrop-filter:blur(9px); 
  background:rgba(0,0,0,0.45); 
  z-index:-1; 
}
header { 
  background:rgba(0,0,0,0.65); 
  padding:20px; 
  text-align:center; 
  color:white; 
  font-size:24px; 
  font-weight:bold; 
  border-bottom:1px solid rgba(255,255,255,0.2); 
  position:relative; 
  display:flex; 
  justify-content:center; 
  align-items:center; 
}
#searchIcon, #wishlistIcon { 
  position:absolute; 
  top:50%; 
  transform:translateY(-50%); 
  cursor:pointer; 
  transition:.3s; 
}
#wishlistIcon { 
  right:20px; 
  font-size:22px; 
  color:white; 
  opacity:.9; 
}
#searchIcon { 
  left:20px; 
  font-size:20px; 
  color:white; 
  opacity:.8; 
}
.products-container { 
  display:grid; 
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); 
  gap:20px; 
  max-width:1200px; 
  margin:20px auto; 
}
.product-card { 
  background: rgba(255,255,255,0.15); 
  backdrop-filter:blur(7px); 
  border-radius:14px; 
  padding:15px; 
  text-align:center; 
  color:white; 
  box-shadow:0 4px 20px rgba(0,0,0,0.25); 
  border:1px solid rgba(255,255,255,0.25); 
  position:relative; 
  cursor:pointer; 
}
.product-card img { 
  width:100%; 
  height:220px; 
  object-fit:cover; 
  border-radius:10px; 
  margin-bottom:12px; 
}
.product-name { 
  font-size:18px; 
  font-weight:bold; 
}
.product-price { 
  font-size:16px; 
  color:#ffeb3b; 
  font-weight:bold; 
}

/* ================= NAV ATAS (DESKTOP) ================= */
.nav-top{
  position:absolute;
  top:15px;
  left:15px;
  display:flex;
  gap:10px;
  z-index:999;
}
.nav-top a{
  padding:8px 14px;
  border-radius:20px;
  background:rgba(255,255,255,0.9);
  text-decoration:none;
  font-size:14px;
  font-weight:bold;
  color:#000;
}
.nav-top .active{
  background:#000;
  color:#fff;
}

/* ================= FIX RESPONSIVE (TAMBAHAN AMAN) ================= */

/* DESKTOP / LAPTOP NORMAL */
@media (min-width: 769px){
  body{ padding-bottom:0; }
  #wishlistIcon{ display:block; }
}

/* MOBILE (HP SAJA) */
@media (max-width: 768px){
  body{ padding-bottom:90px; }

  /* HILANGKAN KERANJANG ATAS DI HP */
  #wishlistIcon{ display:none; }

  header{ font-size:20px; padding:14px; }

  .products-container{
    grid-template-columns:repeat(2,1fr);
    gap:14px;
    padding:0 12px;
  }

  .product-card img{
    height:170px;
  }
}

/* HP KECIL */
@media (max-width:420px){
  .product-card img{ height:150px; }
  .product-name{ font-size:14px; }
  .product-price{ font-size:13px; }
}

/* ================= NAV BAWAH (HP ONLY) ================= */
.nav-bottom{
  display:none;
}

@media (max-width:768px){
  .nav-bottom{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:65px;
    background:rgba(0,0,0,0.9);
    backdrop-filter:blur(10px);
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:99999;
    border-top:1px solid rgba(255,255,255,.2);
  }
  .nav-bottom a{
    color:white;
    text-decoration:none;
    font-size:13px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    opacity:.75;
  }
  .nav-bottom a.active{
    color:#00ffcc;
    opacity:1;
  }
}
</style>
</head>

<body>

<div class="nav-top">
  <a href="index.html">Beranda</a>
  <a href="toko.html" class="active">Toko</a>
</div>

<header>
  <span id="searchIcon">🔍</span>
  <span>FJ Store</span>
  <span id="wishlistIcon">🛒</span>
</header>

<div class="products-container" id="products"></div>

<!-- NAV BAWAH HP -->
<div class="nav-bottom">
  <a href="index.html">
    🏠
    <span>Beranda</span>
  </a>
  <a href="toko.html" class="active">
    🛍️
    <span>Toko</span>
  </a>
  <a href="wishlist.html">
    🛒
    <span>Keranjang</span>
  </a>
</div>

<script>
async function loadProducts(){
  const res = await fetch("products.json");
  const data = await res.json();
  const container = document.getElementById("products");
  container.innerHTML="";
  data.forEach(p=>{
    const card=document.createElement("div");
    card.className="product-card";
    card.innerHTML=`
      <img src="${p.image}">
      <div class="product-name">${p.name}</div>
      <div class="product-price">Rp ${Number(p.price).toLocaleString("id-ID")}</div>
    `;
    card.onclick=()=>location.href=`detail.html?id=${p.id}`;
    container.appendChild(card);
  });
}
loadProducts();
</script>

</body>
</html>
