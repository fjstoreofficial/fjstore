<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FJ Store – Toko</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:url('latarbelakang.jpg') center/cover no-repeat fixed;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(8px);
  z-index:-1;
}

/* HEADER */
header{
  position:fixed;
  top:0; left:0; right:0;
  height:60px;
  background:rgba(0,0,0,.85);
  display:flex;
  align-items:center;
  padding:0 16px;
  z-index:9999;
}
#searchIcon{
  font-size:22px;
  color:#fff;
  cursor:pointer;
}

/* GRID PRODUK */
.products{
  margin-top:80px;
  margin-bottom:90px;
  padding:0 14px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:18px;
}
.card{
  background:rgba(255,255,255,.15);
  border-radius:16px;
  padding:14px;
  color:#fff;
  position:relative;
  cursor:pointer;
}
.card img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:12px;
  background:#fff;
}
.name{
  font-weight:bold;
  margin-top:10px;
}
.price{
  color:#ffeb3b;
  font-weight:bold;
  margin-top:4px;
}

/* TOMBOL KERANJANG DI PRODUK */
.add-cart{
  position:absolute;
  top:14px;
  right:14px;
  background:#000;
  color:#fff;
  width:36px;
  height:36px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}
.add-cart.active{
  background:#00ffcc;
  color:#000;
}

/* NAV BAWAH */
.nav-bottom{
  position:fixed;
  bottom:0; left:0; right:0;
  height:65px;
  background:rgba(0,0,0,.9);
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:9999;
}
.nav-bottom a{
  text-decoration:none;
  color:#fff;
  font-size:12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  opacity:.7;
}
.nav-bottom a.active{
  opacity:1;
  color:#00ffcc;
}

/* SEARCH OVERLAY */
#searchOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  display:none;
  flex-direction:column;
  padding:20px;
  z-index:10000;
}
#searchBox{
  padding:14px;
  font-size:18px;
  border-radius:12px;
  border:none;
  outline:none;
}
#searchResults{
  margin-top:16px;
}
.search-item{
  display:flex;
  gap:12px;
  padding:10px;
  background:rgba(255,255,255,.15);
  border-radius:12px;
  margin-bottom:10px;
  cursor:pointer;
}
.search-item img{
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:8px;
}
</style>
</head>

<body>

<header>
  <span id="searchIcon">🔍</span>
</header>

<div class="products" id="products"></div>

<!-- NAV BAWAH -->
<div class="nav-bottom">
  <a href="index.html">🏠<span>Beranda</span></a>
  <a href="toko.html" class="active">🛍️<span>Toko</span></a>
  <a href="wishlist.html">🛒<span>Keranjang</span></a>
</div>

<!-- SEARCH -->
<div id="searchOverlay">
  <input id="searchBox" placeholder="Cari produk...">
  <div id="searchResults"></div>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let products = [];

/* LOAD PRODUK */
fetch("products.json")
.then(r=>r.json())
.then(data=>{
  products = data;
  renderProducts();
});

function renderProducts(){
  const box=document.getElementById("products");
  box.innerHTML="";
  products.forEach(p=>{
    const active = cart.find(i=>i.id===p.id);
    const div=document.createElement("div");
    div.className="card";
    div.innerHTML=`
      <div class="add-cart ${active?'active':''}" onclick="addToCart(event,${p.id})">🛒</div>
      <img src="${p.image}">
      <div class="name">${p.name}</div>
      <div class="price">Rp ${Number(p.price).toLocaleString("id-ID")}</div>
    `;
    div.onclick=()=>location.href=`detail.html?id=${p.id}`;
    box.appendChild(div);
  });
}

/* TAMBAH KE KERANJANG (INI YANG SEBELUMNYA SALAH) */
function addToCart(e,id){
  e.stopPropagation();
  const index = cart.findIndex(i=>i.id===id);
  if(index>-1){
    cart[index].qty+=1;
  }else{
    cart.push({id:id,qty:1});
  }
  localStorage.setItem("cart",JSON.stringify(cart));
  renderProducts();
}

/* SEARCH */
const overlay=document.getElementById("searchOverlay");
document.getElementById("searchIcon").onclick=()=>{
  overlay.style.display="flex";
  document.getElementById("searchBox").focus();
};
overlay.onclick=e=>{
  if(e.target===overlay) overlay.style.display="none";
};

document.getElementById("searchBox").addEventListener("input",e=>{
  const key=e.target.value.toLowerCase();
  const res=document.getElementById("searchResults");
  res.innerHTML="";
  if(!key) return;
  products.filter(p=>p.name.toLowerCase().includes(key)).forEach(p=>{
    const d=document.createElement("div");
    d.className="search-item";
    d.innerHTML=`
      <img src="${p.image}">
      <div>
        <div>${p.name}</div>
        <div style="color:#ffeb3b">Rp ${Number(p.price).toLocaleString("id-ID")}</div>
      </div>
    `;
    d.onclick=()=>location.href=`detail.html?id=${p.id}`;
    res.appendChild(d);
  });
});
</script>

</body>
</html>
