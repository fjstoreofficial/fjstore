<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FJ.Store – Produk</title>

<style>
/* ================= KODE ASLI KAMU (TIDAK DIHAPUS) ================= */
body { 
  font-family: Arial, sans-serif; 
  margin:0; 
  padding:0; 
  background:url('latarbelakang.jpg') center/cover no-repeat fixed; 
  position:relative; 
}
body::before { 
  content:""; 
  position:fixed; 
  inset:0; 
  backdrop-filter:blur(9px); 
  background:rgba(0,0,0,0.45); 
  z-index:-1; 
}
header { 
  background:rgba(0,0,0,0.65); 
  padding:14px; 
  text-align:center; 
  color:white; 
  font-size:20px; 
  font-weight:bold; 
  border-bottom:1px solid rgba(255,255,255,0.2); 
  position:relative; 
  display:flex; 
  justify-content:center; 
  align-items:center; 
}
#searchIcon, #wishlistIcon { 
  position:absolute; 
  top:50%; 
  transform:translateY(-50%); 
  cursor:pointer; 
}
#searchIcon { 
  font-size:22px; 
  color:white; 
}

/* ================= GRID PRODUK ================= */
.products-container { 
  display:grid; 
  grid-template-columns:repeat(2,1fr); 
  gap:14px; 
  max-width:1100px; 
  margin:20px auto; 
  padding:0 12px;
}
.product-card { 
  background: rgba(255,255,255,0.15); 
  backdrop-filter:blur(7px); 
  border-radius:14px; 
  padding:12px; 
  text-align:center; 
  color:white; 
  box-shadow:0 4px 20px rgba(0,0,0,0.25); 
  border:1px solid rgba(255,255,255,0.25); 
  position:relative; 
  cursor:pointer; 
}
.product-card img { 
  width:100%; 
  height:170px; 
  object-fit:cover; 
  border-radius:10px; 
}
.product-name { 
  font-size:15px; 
  font-weight:bold; 
  margin-top:10px;
}
.product-price { 
  font-size:14px; 
  color:#ffeb3b; 
  font-weight:bold; 
  margin-top:4px;
}

/* ================= ADD TO CART ICON ================= */
.add-cart{
  position:absolute;
  top:10px;
  right:10px;
  background:#000;
  color:#fff;
  border-radius:50%;
  width:34px;
  height:34px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:16px;
  cursor:pointer;
  z-index:10;
}
.add-cart:hover{
  background:#00ffcc;
  color:#000;
}

/* ================= HILANGKAN NAV ATAS ================= */
.nav-top{ display:none; }

/* ================= HEADER MODE SEARCH ONLY ================= */
@media (max-width:768px){
  body{ padding-bottom:80px; }
  header span:not(#searchIcon){ display:none; }
  #searchIcon{
    position:static;
    transform:none;
  }
}

/* ================= NAV BAWAH (TETAP ADA) ================= */
.nav-bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:rgba(0,0,0,0.9);
  backdrop-filter:blur(10px);
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:99999;
  border-top:1px solid rgba(255,255,255,.2);
}
.nav-bottom a{
  color:white;
  text-decoration:none;
  font-size:13px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  opacity:.75;
}
.nav-bottom a.active{
  color:#00ffcc;
  opacity:1;
}
</style>
</head>

<body>

<header>
  <span id="searchIcon">🔍</span>
</header>

<div class="products-container" id="products"></div>

<!-- NAV BAWAH -->
<div class="nav-bottom">
  <a href="index.html">
    🏠
    <span>Beranda</span>
  </a>
  <a href="toko.html" class="active">
    🛍️
    <span>Toko</span>
  </a>
  <a href="wishlist.html">
    🛒
    <span>Keranjang</span>
  </a>
</div>

<script>
async function loadProducts(){
  const res = await fetch("products.json");
  const data = await res.json();
  const container = document.getElementById("products");
  container.innerHTML="";

  data.forEach(p=>{
    const card=document.createElement("div");
    card.className="product-card";
    card.innerHTML=`
      <div class="add-cart" onclick="event.stopPropagation(); addToCart(${p.id})">🛒</div>
      <img src="${p.image}">
      <div class="product-name">${p.name}</div>
      <div class="product-price">Rp ${Number(p.price).toLocaleString("id-ID")}</div>
    `;
    card.onclick=()=>location.href=`detail.html?id=${p.id}`;
    container.appendChild(card);
  });
}

function addToCart(id){
  alert("Produk ID "+id+" ditambahkan ke keranjang");
}

loadProducts();
</script>

</body>
</html>
