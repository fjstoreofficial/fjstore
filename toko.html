<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FJ.Store – Produk</title>

<style>
/* ================= KODE ASLI KAMU (UTUH) ================= */
body { font-family: Arial, sans-serif; margin:0; padding:0; background:url('latarbelakang.jpg') center/cover no-repeat fixed; position:relative; }
body::before { content:""; position:fixed; inset:0; backdrop-filter:blur(9px); background:rgba(0,0,0,0.45); z-index:-1; }
header { background:rgba(0,0,0,0.65); padding:20px; text-align:center; color:white; font-size:24px; font-weight:bold; border-bottom:1px solid rgba(255,255,255,0.2); position:relative; display:flex; justify-content:center; align-items:center; }
#searchIcon, #wishlistIcon { position:absolute; top:50%; transform:translateY(-50%); cursor:pointer; transition:.3s; }
#wishlistIcon { right:60px; font-size:22px; color:white; opacity:.9; display:flex; align-items:center; gap:5px; }
#wishlistIcon:hover { transform:translateY(-50%) scale(1.15); opacity:1; text-shadow:0 0 15px #ff4d6d; }
#searchIcon { right:20px; font-size:20px; color:white; opacity:.8; }
#searchIcon:hover { opacity:1; transform:translateY(-50%) scale(1.15); }
.products-container { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:20px; max-width:1200px; margin:20px auto; }
.product-card { background: rgba(255,255,255,0.15); backdrop-filter:blur(7px); border-radius:14px; padding:15px; text-align:center; color:white; box-shadow:0 4px 20px rgba(0,0,0,0.25); border:1px solid rgba(255,255,255,0.25); position:relative; overflow:hidden; transition:.3s; cursor:pointer; }
.product-card:hover { transform:scale(1.05); background: rgba(255,255,255,0.26); box-shadow:0 6px 30px rgba(0,0,0,0.35); }
.product-card img { width:100%; height:220px; object-fit:cover; border-radius:10px; margin-bottom:12px; }
.product-name { font-size:18px; font-weight:bold; color:#fff; text-shadow:1px 1px 3px #000; }
.product-price { font-size:16px; color:#ffeb3b; font-weight:bold; margin-top:5px; text-shadow:1px 1px 3px #000; }
.wishlist-heart { position:absolute; top:12px; right:12px; font-size:22px; cursor:pointer; transition:transform .25s,color .25s; text-shadow:1px 1px 4px black; opacity:.85; z-index:99; }
.wishlist-heart:hover { transform:scale(1.15); opacity:1; }
.wishlist-heart.active { color:#ff4d6d; transform:scale(1.25); animation:bounce 0.3s; }
@keyframes bounce { 0%{transform:scale(1);} 50%{transform:scale(1.4);} 100%{transform:scale(1.25);} }

/* ================= OVERRIDE AMAN (TANPA SENTUH KODE) ================= */

/* 1️⃣ GANTI IKON LOVE → KERANJANG */
.wishlist-heart{
  color:transparent !important;
}
.wishlist-heart::before{
  content:"🛒";
  color:white;
  font-size:22px;
}

/* 2️⃣ HILANGKAN ANGKA (0) WISHLIST */
#wishlistCount{
  display:none !important;
}

/* 3️⃣ HILANGKAN TEKS FJ.STORE DI HEADER */
header{
  font-size:0 !important;
}

/* 4️⃣ POSISI IKON TETAP RAPIH */
#wishlistIcon, #searchIcon{
  font-size:22px;
}

/* RESPONSIVE */
@media(max-width:500px){
  #wishlistIcon{ right:50px; }
  #searchIcon{ right:15px; }
}
</style>
</head>

<body>

<header>
  FJ.Store
  <span id="wishlistIcon">❤️ <span id="wishlistCount">(0)</span></span>
  <span id="searchIcon">🔍</span>
</header>

<div class="products-container" id="products"></div>

<div id="searchOverlay">
  <div id="closeSearch">✖</div>
  <input id="searchBox" type="text" placeholder="Cari produk..." autocomplete="off" />
  <div id="searchResults"></div>
</div>

<script>
/* ===== SCRIPT ASLI KAMU (UTUH, TIDAK DIUBAH) ===== */
let wishlist = JSON.parse(localStorage.getItem("wishlist")||"[]");
function saveWishlist(){ localStorage.setItem("wishlist",JSON.stringify(wishlist)); }
function updateWishlistCounter(){ document.getElementById("wishlistCount").innerText=`(${wishlist.length})`; }
updateWishlistCounter();

async function loadProducts(){
  const res = await fetch("products.json");
  const data = await res.json();
  const container = document.getElementById("products");
  container.innerHTML = "";
  data.forEach(p=>{
    const card = document.createElement("div");
    card.className = "product-card";
    card.innerHTML = `<img src="${p.image}" alt="${p.name}">
      <div class="product-name">${p.name}</div>
      <div class="product-price">Rp ${Number(p.price).toLocaleString("id-ID")}</div>`;
    card.onclick = () => window.location.href = `detail.html?id=${p.id}`;

    const heart = document.createElement("div");
    heart.className = "wishlist-heart";
    heart.innerText = "❤";

    if(wishlist.includes(p.id)) heart.classList.add("active");

    heart.onclick = e=>{
      e.stopPropagation();
      if(wishlist.includes(p.id)){
        wishlist = wishlist.filter(x=>x!==p.id);
        heart.classList.remove("active");
      } else {
        wishlist.push(p.id);
        heart.classList.add("active");
      }
      saveWishlist(); updateWishlistCounter();
    };

    card.appendChild(heart);
    container.appendChild(card);
  });
}

document.getElementById("wishlistIcon").onclick=()=>{
  window.location.href="wishlist.html";
};

loadProducts();
</script>

</body>
</html>
