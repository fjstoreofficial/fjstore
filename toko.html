<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FJ.Store – Produk</title>

<style>
/* ================= KODE ASLI KAMU (TIDAK DIUBAH) ================= */
body { font-family: Arial, sans-serif; margin:0; padding:0; background:url('latarbelakang.jpg') center/cover no-repeat fixed; position:relative; }
body::before { content:""; position:fixed; inset:0; backdrop-filter:blur(9px); background:rgba(0,0,0,0.45); z-index:-1; }

header { background:rgba(0,0,0,0.65); padding:20px; text-align:center; color:white; font-size:24px; font-weight:bold; border-bottom:1px solid rgba(255,255,255,0.2); position:relative; display:flex; justify-content:center; align-items:center; }
#searchIcon, #wishlistIcon { position:absolute; top:50%; transform:translateY(-50%); cursor:pointer; transition:.3s; }
#wishlistIcon { right:60px; font-size:22px; color:white; opacity:.9; display:flex; align-items:center; gap:5px; }
#searchIcon { right:20px; font-size:20px; color:white; opacity:.8; }

.products-container { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:20px; max-width:1200px; margin:20px auto; }

.product-card {
  background: rgba(255,255,255,0.15);
  backdrop-filter:blur(7px);
  border-radius:14px;
  padding:15px;
  text-align:center;
  color:white;
  box-shadow:0 4px 20px rgba(0,0,0,0.25);
  border:1px solid rgba(255,255,255,0.25);
  cursor:pointer;
}
.product-card img { width:100%; height:220px; object-fit:cover; border-radius:10px; margin-bottom:12px; }
.product-name { font-size:18px; font-weight:bold; }
.product-price { font-size:16px; color:#ffeb3b; font-weight:bold; }

/* ================= SEARCH OVERLAY ================= */
#searchOverlay {
  position:fixed; inset:0;
  background:rgba(0,0,0,0.88);
  backdrop-filter:blur(10px);
  display:none;
  justify-content:flex-start;
  align-items:center;
  padding-top:120px;
  z-index:99999;
  flex-direction:column;
}
#searchBox { width:80%; max-width:600px; padding:15px 20px; border-radius:12px; border:none; font-size:20px; }
#closeSearch { position:absolute; top:30px; right:35px; font-size:26px; color:white; cursor:pointer; }

/* ================= MOBILE MARKETPLACE ADDITION ================= */
@media (max-width:768px){

  body{
    padding-top:60px;
    padding-bottom:70px;
  }

  header{
    display:none;
  }

  .mobile-topbar{
    position:fixed;
    top:0; left:0; right:0;
    height:56px;
    background:rgba(0,0,0,.8);
    backdrop-filter:blur(8px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    z-index:100000;
    border-bottom:1px solid rgba(255,255,255,.15);
  }

  .mobile-topbar .icon{
    font-size:22px;
    color:white;
    cursor:pointer;
  }

  .mobile-topbar .title{
    font-size:16px;
    font-weight:bold;
    color:white;
  }

  .mobile-bottom-nav{
    position:fixed;
    bottom:0; left:0; right:0;
    height:60px;
    background:rgba(0,0,0,.9);
    backdrop-filter:blur(8px);
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:100000;
    border-top:1px solid rgba(255,255,255,.15);
  }

  .mobile-bottom-nav a{
    color:white;
    text-decoration:none;
    font-size:12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    opacity:.75;
  }

  .mobile-bottom-nav a.active{
    opacity:1;
    color:#ff4d6d;
  }

  .mobile-bottom-nav span{
    font-size:22px;
  }

  .products-container{
    grid-template-columns:repeat(2,1fr);
    gap:14px;
    padding:0 12px;
  }
}
</style>
</head>

<body>

<!-- ========== MOBILE TOP BAR ========= -->
<div class="mobile-topbar">
  <div class="icon" id="mobileSearch">🔍</div>
  <div class="title">FJ Store</div>
  <div class="icon" id="mobileCart">🛒</div>
</div>

<!-- ========== MOBILE BOTTOM NAV ========= -->
<div class="mobile-bottom-nav">
  <a href="index.html">
    <span>🏠</span>Beranda
  </a>
  <a href="toko.html" class="active">
    <span>🛍️</span>Toko
  </a>
  <a href="wishlist.html">
    <span>🛒</span>Keranjang
  </a>
</div>

<!-- ========== DESKTOP HEADER (ASLI) ========= -->
<header>
  <span id="wishlistIcon">🛒</span>
  <span id="searchIcon">🔍</span>
</header>

<div class="products-container" id="products"></div>

<div id="searchOverlay">
  <div id="closeSearch">✖</div>
  <input id="searchBox" placeholder="Cari produk...">
</div>

<script>
/* ===== LOAD PRODUK ===== */
fetch("products.json").then(r=>r.json()).then(data=>{
  const box=document.getElementById("products");
  data.forEach(p=>{
    const d=document.createElement("div");
    d.className="product-card";
    d.innerHTML=`<img src="${p.image}">
                 <div class="product-name">${p.name}</div>
                 <div class="product-price">Rp ${Number(p.price).toLocaleString("id-ID")}</div>`;
    d.onclick=()=>location.href=`detail.html?id=${p.id}`;
    box.appendChild(d);
  });
});

/* ===== SEARCH ===== */
const overlay=document.getElementById("searchOverlay");
document.getElementById("searchIcon").onclick=()=>overlay.style.display="flex";
document.getElementById("closeSearch").onclick=()=>overlay.style.display="none";

/* ===== MOBILE ACTION ===== */
document.getElementById("mobileSearch").onclick=()=>{
  overlay.style.display="flex";
  document.getElementById("searchBox").focus();
};
document.getElementById("mobileCart").onclick=()=>{
  location.href="wishlist.html";
};
</script>

</body>
</html>
