<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FJ.Store – Produk</title>

<style>
/* ================= KODE ASLI (AMAN) ================= */
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:url('latarbelakang.jpg') center/cover no-repeat fixed;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  backdrop-filter:blur(9px);
  background:rgba(0,0,0,.45);
  z-index:-1;
}

/* ================= HEADER BAR BARU ================= */
header{
  position:sticky;
  top:0;
  height:56px;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(10px);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  z-index:9999;
  border-bottom:1px solid rgba(255,255,255,.2);
}

/* tombol back ala shopee */
#backBtn{
  position:absolute;
  left:15px;
  font-size:24px;
  cursor:pointer;
  opacity:.9;
}
#backBtn:hover{ opacity:1; transform:scale(1.1); }

#headerTitle{
  font-size:20px;
  font-weight:bold;
}

#searchIcon,#wishlistIcon{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
}
#wishlistIcon{
  right:55px;
  font-size:22px;
}
#searchIcon{
  right:15px;
  font-size:20px;
}

/* ================= PRODUK ================= */
.products-container{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:20px;
  max-width:1200px;
  margin:20px auto;
  padding:0 15px;
}

.product-card{
  background:rgba(255,255,255,.15);
  backdrop-filter:blur(7px);
  border-radius:14px;
  padding:15px;
  text-align:center;
  color:white;
  border:1px solid rgba(255,255,255,.25);
  cursor:pointer;
  transition:.3s;
  position:relative;
}
.product-card:hover{
  transform:scale(1.05);
  background:rgba(255,255,255,.26);
}

.product-card img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:10px;
}
.product-name{
  font-size:17px;
  font-weight:bold;
  margin-top:10px;
}
.product-price{
  color:#ffeb3b;
  font-weight:bold;
}

/* wishlist icon */
.wishlist-heart{
  position:absolute;
  top:12px;
  right:12px;
  font-size:22px;
  cursor:pointer;
}
.wishlist-heart.active{ color:#ff4d6d; }

/* ================= SEARCH ================= */
#searchOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  display:none;
  flex-direction:column;
  padding-top:100px;
  z-index:99999;
}
#searchBox{
  width:80%;
  max-width:600px;
  padding:15px;
  border-radius:12px;
  border:none;
  font-size:18px;
}
#closeSearch{
  position:absolute;
  top:25px;
  right:25px;
  font-size:26px;
  cursor:pointer;
}
#searchResults{
  width:80%;
  max-width:650px;
  margin-top:20px;
}

.search-item{
  display:flex;
  gap:12px;
  background:rgba(255,255,255,.15);
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
  cursor:pointer;
  color:white;
}
.search-thumb{
  width:60px;
  height:60px;
  border-radius:10px;
  object-fit:cover;
}

/* ================= MOBILE ================= */
@media(max-width:600px){
  .products-container{
    grid-template-columns:repeat(2,1fr);
  }
  .product-card img{ height:160px; }
}
</style>
</head>

<body>

<header>
  <div id="backBtn" onclick="history.back()">←</div>
  <div id="headerTitle">FJ.STORE</div>
  <div id="wishlistIcon">🛒 <span id="wishlistCount">(0)</span></div>
  <div id="searchIcon">🔍</div>
</header>

<div class="products-container" id="products"></div>

<div id="searchOverlay">
  <div id="closeSearch">✖</div>
  <input id="searchBox" placeholder="Cari produk...">
  <div id="searchResults"></div>
</div>

<script>
/* ================= SCRIPT ASLI ================= */
let wishlist = JSON.parse(localStorage.getItem("wishlist")||"[]");
function saveWishlist(){ localStorage.setItem("wishlist",JSON.stringify(wishlist)); }
function updateWishlistCounter(){
  document.getElementById("wishlistCount").innerText=`(${wishlist.length})`;
}
updateWishlistCounter();

async function loadProducts(){
  const res = await fetch("products.json");
  const data = await res.json();
  const container = document.getElementById("products");
  container.innerHTML="";
  data.forEach(p=>{
    const card=document.createElement("div");
    card.className="product-card";
    card.innerHTML=`
      <img src="${p.image}">
      <div class="product-name">${p.name}</div>
      <div class="product-price">Rp ${Number(p.price).toLocaleString("id-ID")}</div>
    `;
    card.onclick=()=>location.href=`detail.html?id=${p.id}`;

    const heart=document.createElement("div");
    heart.className="wishlist-heart";
    heart.innerText="🛒";
    if(wishlist.includes(p.id)) heart.classList.add("active");

    heart.onclick=e=>{
      e.stopPropagation();
      if(wishlist.includes(p.id)){
        wishlist=wishlist.filter(x=>x!==p.id);
        heart.classList.remove("active");
      }else{
        wishlist.push(p.id);
        heart.classList.add("active");
      }
      saveWishlist();
      updateWishlistCounter();
    };

    card.appendChild(heart);
    container.appendChild(card);
  });
}

const overlay=document.getElementById("searchOverlay");
document.getElementById("searchIcon").onclick=()=>overlay.style.display="flex";
document.getElementById("closeSearch").onclick=()=>overlay.style.display="none";

let allProducts=[];
fetch("products.json").then(r=>r.json()).then(d=>allProducts=d);

document.getElementById("searchBox").addEventListener("input",e=>{
  const key=e.target.value.toLowerCase();
  const res=document.getElementById("searchResults");
  res.innerHTML="";
  if(!key) return;
  allProducts.filter(p=>p.name.toLowerCase().includes(key))
  .forEach(p=>{
    const div=document.createElement("div");
    div.className="search-item";
    div.innerHTML=`
      <img src="${p.image}" class="search-thumb">
      <div>
        <div>${p.name}</div>
        <div style="color:#ffeb3b">Rp ${Number(p.price).toLocaleString("id-ID")}</div>
      </div>`;
    div.onclick=()=>location.href=`detail.html?id=${p.id}`;
    res.appendChild(div);
  });
});

document.getElementById("wishlistIcon").onclick=()=>location.href="wishlist.html";
loadProducts();
</script>

</body>
</html>
