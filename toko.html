<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FJ.Store – Produk</title>

<style>
/* ================= BASE ================= */
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:url('latarbelakang.jpg') center/cover fixed;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(8px);
  z-index:-1;
}

/* ================= HEADER ================= */
header{
  height:56px;
  display:flex;
  align-items:center;
  padding:0 16px;
  background:rgba(0,0,0,.7);
  border-bottom:1px solid rgba(255,255,255,.2);
}
#searchIcon{
  font-size:22px;
  cursor:pointer;
  color:#fff;
}

/* ================= GRID ================= */
.products-container{
  max-width:1200px;
  margin:20px auto 100px;
  padding:0 16px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:20px;
}
.product-card{
  background:rgba(255,255,255,.15);
  border-radius:14px;
  padding:12px;
  color:#fff;
  cursor:pointer;
  position:relative;
  backdrop-filter:blur(6px);
}
.product-card img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:10px;
}
.product-name{
  font-size:16px;
  font-weight:bold;
  margin-top:10px;
}
.product-price{
  color:#ffeb3b;
  font-weight:bold;
  margin-top:4px;
}

/* ================= ADD CART ================= */
.add-cart{
  position:absolute;
  top:12px;
  right:12px;
  width:36px;
  height:36px;
  background:#000;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:16px;
}
.add-cart:active{
  transform:scale(.9);
}

/* ================= MOBILE ================= */
@media(max-width:768px){
  .products-container{
    grid-template-columns:repeat(2,1fr);
    gap:14px;
  }
  .product-card img{
    height:160px;
  }
}

/* ================= NAV BOTTOM ================= */
.nav-bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:#000;
  display:flex;
  justify-content:space-around;
  align-items:center;
}
.nav-bottom a{
  color:#aaa;
  font-size:13px;
  text-decoration:none;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.nav-bottom a.active{
  color:#00ffcc;
}
</style>
</head>

<body>

<header>
  <span id="searchIcon">🔍</span>
</header>

<div class="products-container" id="products"></div>

<div class="nav-bottom">
  <a href="index.html">🏠<span>Beranda</span></a>
  <a href="toko.html" class="active">🛍️<span>Toko</span></a>
  <a href="wishlist.html">🛒<span>Keranjang</span></a>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function addToCart(id){
  cart.push(id);
  localStorage.setItem("cart", JSON.stringify(cart));
  navigator.vibrate?.(50);
}

async function loadProducts(){
  const res = await fetch("products.json");
  const data = await res.json();
  const box = document.getElementById("products");

  data.forEach(p=>{
    const card = document.createElement("div");
    card.className="product-card";
    card.innerHTML=`
      <div class="add-cart">🛒</div>
      <img src="${p.image}">
      <div class="product-name">${p.name}</div>
      <div class="product-price">Rp ${p.price.toLocaleString("id-ID")}</div>
    `;

    card.onclick=()=>location.href=`detail.html?id=${p.id}`;
    card.querySelector(".add-cart").onclick=(e)=>{
      e.stopPropagation();
      addToCart(p.id);
    };

    box.appendChild(card);
  });
}
loadProducts();
</script>

</body>
</html>
